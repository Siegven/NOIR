name: NOIR CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # 1. FRONTEND BUILD & BUNDLE VERIFICATION
  # -------------------------------------------------------------
  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend Application (Vite + React)
        working-directory: frontend
        run: npm run build

  # -------------------------------------------------------------
  # 2. BACKEND SYNTAX, IMPORTS & QUALITY AUDITOR TESTS
  # -------------------------------------------------------------
  backend:
    name: Backend Tests & Quality Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m py_compile backend/*.py

      - name: Run NOIR Quality Engine Unit Tests
        run: |
          python backend/tests/test_quality_auditor.py
